# xcodegen 스펙 — 이 파일이 프로젝트의 정본이고 .xcodeproj 는 생성물(gitignore)이다. `xcodegen generate` 로 만든다.
name: {{product}}
options:
  bundleIdPrefix: {{id_prefix}}
  deploymentTarget:
    iOS: "{{min_ios}}.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  {{product}}:
    scheme:
      testTargets: [{{product}}UITests]
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{id}}
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "{{name}}"
        SWIFT_STRICT_CONCURRENCY: complete
  # twbuild: screen tour UI tests — UITests/TwTour.swift (helper) · TwScreenTour.swift (generated from the layout trees)
  {{product}}UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: {{product}}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{id}}.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: {{product}}
